# ArgoCD가 읽는 진입점.
# app/index.html(앱 소스)로 ConfigMap을 만들고, 내용이 바뀌면 이름 뒤 해시가 바뀌어
# Deployment가 자동으로 새 Pod로 교체된다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
- k8s/deployment.yaml
- k8s/service.yaml
configMapGenerator:
- name: cicd-web-html
  files:
  - index.html=app/index.html
